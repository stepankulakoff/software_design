name: currency-homework3

services:
  zookeeper:
    image: zookeeper:3.9.5
    environment:
      ZOO_CFG_EXTRA: >-
        metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider
        metricsProvider.httpPort=7070
        metricsProvider.exportJvmInfo=true
    ports:
      - "127.0.0.1:22181:2181"
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pact
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact-local
    volumes:
      - pact-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact"]
      interval: 5s
      timeout: 5s
      retries: 20

  pact-broker:
    image: pactfoundation/pact-broker:3.0.0-pactbroker2.121.2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:9292:9292"
    environment:
      PACT_BROKER_DATABASE_ADAPTER: postgres
      PACT_BROKER_DATABASE_HOST: postgres
      PACT_BROKER_DATABASE_NAME: pact
      PACT_BROKER_DATABASE_USERNAME: pact
      PACT_BROKER_DATABASE_PASSWORD: pact-local
      PACT_BROKER_PORT: "9292"
      PACT_BROKER_BASE_URL: http://localhost:9292
      PACT_DO_NOT_TRACK: "true"
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://localhost:9292/diagnostic/status/heartbeat')).is_a?(Net::HTTPSuccess) ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  service1:
    image: eclipse-temurin:21-jre
    profiles: [apps]
    environment:
      ZOOKEEPER_ADDRESS: zookeeper:2181
      PROVIDER_HOST: service1
    command: [java, -Xmx256m, -jar, /app/app.jar, --server.port=8080]
    volumes:
      - ./rate-provider/target/rate-provider-1.0.0.jar:/app/app.jar:ro
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      zookeeper: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080; printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 30

  service2:
    extends: service1
    environment:
      PROVIDER_HOST: service2
    ports: !override ["127.0.0.1:8082:8080"]

  client:
    extends: service1
    environment:
      CLIENT_ID: rate-printer
    volumes: !override
      - ./rate-printer/target/rate-printer-1.0.0.jar:/app/app.jar:ro
    ports: !override ["127.0.0.1:8083:8080"]

  prometheus:
    image: prom/prometheus:v3.5.5
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  grafana:
    image: grafana/grafana:13.2.2
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: homework
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  prometheus-data:
  grafana-data:
  pact-data:

spring.application.name=rate-printer
spring.main.banner-mode=off
server.port=${PRINTER_PORT:8083}
discovery.address=${ZOOKEEPER_ADDRESS:localhost:22181}
discovery.path=/services/currency-http
logging.level.org.apache.zookeeper=WARN
logging.level.org.apache.curator=WARN
logging.level.root=INFO

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
client.id=${CLIENT_ID:rate-printer}
